name: Verify experimental branch
on:
  push:
    branches: [experimental]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: experimental
      - name: Validate JavaScript and experimental audio
        run: |
          node --check fingering-presets.js
          node --check fingerboard.js
          node --check fingerboard-editor.js
          node --check classroom.js
          node --test tests/*.test.cjs
