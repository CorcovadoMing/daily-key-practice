name: Publish stable and experimental

# GitHub Pages deployments are authorized from main only.
# Experimental pushes first run "Verify experimental branch"; its successful
# completion triggers this publisher on the default (main) branch.
on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Verify experimental branch"]
    branches:
      - experimental
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-key-practice-dual-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable
        uses: actions/checkout@v6
        with:
          ref: main
          path: stable
      - name: Checkout experimental
        uses: actions/checkout@v6
        with:
          ref: experimental
          path: experiment
      - name: Combine both independent branch snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/experimental
          for file in index.html fingering-presets.js fingerboard.js fingerboard-editor.js classroom.js firebase-config.js; do
            cp "stable/$file" "_site/$file"
            cp "experiment/$file" "_site/experimental/$file"
          done
          if [[ -f experiment/metronome-worklet.js ]]; then
            cp experiment/metronome-worklet.js _site/experimental/
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
